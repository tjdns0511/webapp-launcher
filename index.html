</style></head><body><header class="top"><h1>WebApp Launcher <span class="ver">v3</span></h1><button class="btn" id="backup">백업</button><button class="btn primary" id="add">＋</button></header><div id="grid" class="grid"></div><div id="empty" class="empty">설치된 앱이 없습니다.<br>＋ 버튼으로 HTML 또는 ZIP 웹앱을 설치하세요.</div>

<script>
const $=s=>document.querySelector(s), enc=new TextEncoder(), dec=new TextDecoder();let current=null,pendingHTML=null,runtimeUrls=[];

const DB='webapp-launcher-v3',VER=1;function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('apps',{keyPath:'id'});d.createObjectStore('files',{keyPath:['appId','path']});d.createObjectStore('data',{keyPath:['appId','key']})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}

async function allApps(){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('apps').objectStore('apps').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}

async function render(){let a=(await allApps()).sort((x,y)=>x.name.localeCompare(y.name));$('#empty').style.display=a.length?'none':'block';$('#grid').innerHTML='';for(let x of a){let e=document.createElement('div');e.className='app';let icon=x.iconData?`<img src="${x.iconData}">`:'◫';e.innerHTML=`<div class="icon">${icon}</div><div class="name"></div><div class="ver"></div>`;e.querySelector('.name').textContent=x.name;e.querySelector('.ver').textContent=x.version;e.onclick=()=>run(x.id);e.oncontextmenu=v=>{v.preventDefault();showInfo(x.id)};$('#grid').append(e)}}

function mime(p){let e=p.split('.').pop().toLowerCase();return({html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',json:'application/json',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',gif:'image/gif',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',woff:'font/woff',woff2:'font/woff2'})[e]||'application/octet-stream'}

async function dataGet(appId,key){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('data').objectStore('data').get([appId,key]);r.onsuccess=()=>ok(r.result?.value);r.onerror=()=>no(r.error)})}
async function buildRuntime(app,files){runtimeUrls.forEach(URL.revokeObjectURL);runtimeUrls=[];let map=new Map(files.map(f=>[f.path,f.data])),urls=new Map(),building=new Set();function make(path){path=norm(path);if(urls.has(path))return urls.get(path);let d=map.get(path);if(!d)return null;if(building.has(path))return null;building.add(path);let text=null;if(/\.css$/i.test(path)){text=dec.decode(d).replace(/url\(\s*(['"]?)([^)'\"]+)\1\s*\)/gi,(m,q,r)=>{let u=make(resolve(path,r));return u?`url(${q}${u}${q})`:m})}else if(/\.(m?js)$/i.test(path)){text=dec.decode(d).replace(/(from\s*|import\s*)(['"])(\.{1,2}\/[^'\"]+)\2/g,(m,a,q,r)=>{let u=make(resolve(path,r));return u?`${a}${q}${u}${q}`:m})}let u=URL.createObjectURL(new Blob([text??d],{type:mime(path)}));runtimeUrls.push(u);urls.set(path,u);building.delete(path);return u}for(let f of files)if(!/\.(html?)$/i.test(f.path))make(f.path);let entry=dec.decode(map.get(app.entry));entry=entry.replace(/(src|href)=(['"])([^'\"]+)\2/gi,(m,a,q,r)=>{let u=make(resolve(app.entry,r));return u?`${a}=${q}${u}${q}`:m});let legacy=await dataGet(app.id,'__legacyLocalStorage')||{};let net=app.permissions.includes('network')?'https: http:':'',csp=`default-src 'none'; script-src 'unsafe-inline' blob: ${net}; style-src 'unsafe-inline' blob: ${net}; img-src data: blob: ${net}; media-src data: blob: ${net}; font-src data: blob: ${net}; connect-src ${net||"'none'"};`;let bridge=`<meta http-equiv="Content-Security-Policy" content="${csp}"><script>(function(){let d=${JSON.stringify(legacy)},api={get length(){return Object.keys(d).length},key:i=>Object.keys(d)[i]??null,getItem:k=>Object.prototype.hasOwnProperty.call(d,k)?String(d[k]):null,setItem:(k,v)=>{d[k]=String(v);parent.postMessage({__wla:1,type:'legacy',value:d},'*')},removeItem:k=>{delete d[k];parent.postMessage({__wla:1,type:'legacy',value:d},'*')},clear:()=>{d={};parent.postMessage({__wla:1,type:'legacy',value:d},'*')}};try{Object.defineProperty(window,'localStorage',{value:api})}catch{}window.launcher={save:(k,v)=>parent.postMessage({__wla:1,type:'save',key:k,value:v},'*'),load:k=>new Promise(r=>{let id=Math.random().toString(36);addEventListener('message',function h(e){if(e.data?.__wlaReply===id){removeEventListener('message',h);r(e.data.value)}});parent.postMessage({__wla:1,type:'load',key:k,reply:id},'*')}),appInfo:()=>${JSON.stringify({id:app.id,name:app.name,version:app.version,permissions:app.permissions})},fullscreen:()=>parent.postMessage({__wla:1,type:'fullscreen'},'*')}})();<\/script>`;entry=/<head[^>]*>/i.test(entry)?entry.replace(/<head([^>]*)>/i,`<head$1>${bridge}`):bridge+entry;return entry}
async function run(id){let a=await getApp(id),f=await appFiles(id);current=id;$('#viewTitle').textContent=a.name;$('#frame').srcdoc=await buildRuntime(a,f);$('#viewer').classList.add('on')}
addEventListener('message',async e=>{if(!e.data?.__wla||!current)return;let a=await getApp(current);if(e.data.type==='fullscreen'&&a.permissions.includes('fullscreen'))$('#viewer').requestFullscreen?.();if(!a.permissions.includes('storage'))return;if(e.data.type==='save')await tx('data','readwrite',s=>s.put({appId:current,key:String(e.data.key),value:e.data.value}));if(e.data.type==='legacy')await tx('data','readwrite',s=>s.put({appId:current,key:'__legacyLocalStorage',value:e.data.value}));if(e.data.type==='load'){let d=await db(),r=d.transaction('data').objectStore('data').get([current,String(e.data.key)]);r.onsuccess=()=>$('#frame').contentWindow.postMessage({__wlaReply:e.data.reply,value:r.result?.value},'*')}})
async function showInfo(id){let a=await getApp(id),f=await appFiles(id);current=id;$('#detailTitle').textContent=a.name;$('#detailBody').innerHTML=`<div class="card"><b>${a.name}</b><p class="muted">${a.id}<br>버전 ${a.version} · 파일 ${f.length}개<br>Entry: ${a.entry}</p></div><div class="card"><b>권한</b>${a.permissions.map(p=>`<div class="perm">• ${p}</div>`).join('')||'<p class="muted">없음</p>'}</div><div class="row"><button class="btn" id="exportApp">앱 내보내기</button><button class="btn danger" id="delApp">앱 삭제</button><button class="btn danger" id="delAll">앱+데이터 삭제</button></div>`;$('#details').classList.add('on');$('#exportApp').onclick=()=>exportOne(id);$('#delApp').onclick=async()=>{if(confirm('앱만 삭제할까요? 저장 데이터는 남습니다.')){await removeApp(id,false);$('#details').classList.remove('on')}};$('#delAll').onclick=async()=>{if(confirm('앱과 저장 데이터를 모두 삭제할까요?')){await removeApp(id,true);$('#details').classList.remove('on')}}}
async function exportOne(id){let a=await getApp(id),f=await appFiles(id);download(zip([{path:'manifest.json',data:JSON.stringify(a,null,2)},...f.map(x=>({path:x.path,data:x.data}))]),a.id+'.zip')}

async function migrate(){try{let old=await new Promise((ok,no)=>{let r=indexedDB.open('webapp-launcher-db');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});if(!old.objectStoreNames.contains('apps'))throw Error('v2 데이터 없음');let arr=await new Promise(o=>{let r=old.transaction('apps').objectStore('apps').getAll();r.onsuccess=()=>o(r.result||[])});for(let a of arr){let id='legacy.'+String(a.id).replace(/[^a-z0-9._-]/gi,'-').toLowerCase();await installApp({id,name:a.name||'Legacy App',version:'2-migrated',entry:'index.html',permissions:['storage','fullscreen'],iconData:a.icon||null},[{path:'index.html',data:enc.encode(a.source||'')}])}toast(`${arr.length}개 가져옴`)}catch(e){alert(e.message)}}
$('#add').onclick=()=>$('#install').classList.add('on');document.querySelectorAll('.close').forEach(x=>x.onclick=()=>x.closest('.sheet').classList.remove('on'));$('#back').onclick=()=>{$('#viewer').classList.remove('on');$('#frame').srcdoc='';current=null;runtimeUrls.forEach(URL.revokeObjectURL);runtimeUrls=[]};$('#info').onclick=()=>showInfo(current);$('#full').onclick=()=>$('#viewer').requestFullscreen?.();$('#backup').onclick=backupAll;$('#migrate').onclick=migrate;
$('#htmlPick').onchange=async e=>{let f=e.target.files[0];if(!f)return;pendingHTML={name:f.name.replace(/\.html?$/i,''),data:new Uint8Array(await f.arrayBuffer())};$('#htmlName').value=pendingHTML.name;$('#htmlId').value='app.'+pendingHTML.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/^-|-$/g,'');$('#htmlMeta').showModal()};$('#htmlCancel').onclick=()=>$('#htmlMeta').close();$('#htmlInstall').onclick=async()=>{try{await installApp({id:$('#htmlId').value,name:$('#htmlName').value,version:'1.0.0',entry:'index.html',permissions:['storage','fullscreen']},[{path:'index.html',data:pendingHTML.data}]);$('#htmlMeta').close();$('#install').classList.remove('on')}catch(e){alert(e.message)}};
$('#zipPick').onchange=async e=>{try{let fs=await unzip(await e.target.files[0].arrayBuffer()),mf=fs.find(f=>f.path==='manifest.json');if(!mf)throw Error('manifest.json이 없습니다');let m=JSON.parse(dec.decode(mf.data));await installApp(m,fs.filter(f=>f.path!=='manifest.json'));$('#install').classList.remove('on')}catch(x){alert(x.message)}};$('#restorePick').onchange=async e=>{try{await restoreBackup(e.target.files[0]);$('#install').classList.remove('on')}catch(x){alert(x.message)}};render();
</script></body></html>
