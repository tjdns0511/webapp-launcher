<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>WebApp Launcher v3</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d0f14;color:#eef1f7;font:15px system-ui,sans-serif}button,input{font:inherit}.top{height:62px;display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #272b35;gap:10px}.top h1{font-size:18px;margin:0;flex:1}.btn,.pick{border:1px solid #343a47;background:#1b1f28;color:#fff;border-radius:12px;padding:11px 14px;cursor:pointer}.primary{background:#eef1f7;color:#111}.grid{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px}.app{text-align:center}.icon{width:70px;height:70px;margin:auto;border-radius:18px;background:#202531;display:grid;place-items:center;font-size:28px;border:1px solid #303746}.name{margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted,.ver{font-size:12px;color:#9098a9}.empty{padding:70px 24px;text-align:center;color:#8e96a8}.sheet,.viewer{position:fixed;inset:0;background:#0d0f14;z-index:10;display:none}.on{display:block}.sheet main{max-width:700px;margin:auto;padding:18px}.card{border:1px solid #292f3a;border-radius:14px;padding:16px;margin:12px 0;background:#12151c}.pick{display:flex;justify-content:center;align-items:center;width:100%;min-height:50px;margin-top:12px}.pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.viewer{background:#000}.bar{height:56px;background:#11151c;display:flex;align-items:center;gap:8px;padding:8px}.bar span{flex:1}.viewer iframe{width:100%;height:calc(100% - 56px);border:0;background:white}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head>
<body><header class="top"><h1>WebApp Launcher <span class="ver">v3</span></h1><button id="backup" class="btn">백업</button><button id="add" class="btn primary">＋</button></header><div id="grid" class="grid"></div><div id="empty" class="empty">설치된 앱이 없습니다.<br>＋ 버튼으로 HTML 또는 ZIP 웹앱을 설치하세요.</div>
<section id="install" class="sheet"><header class="top"><button class="btn close">←</button><h1>앱 설치</h1></header><main><div class="card"><b>HTML</b><p class="muted">단일 HTML 파일을 앱으로 설치합니다.</p><label class="pick">HTML 파일 선택<input id="htmlPick" type="file" accept=".html,.htm,text/html"></label></div><div class="card"><b>ZIP 패키지</b><p class="muted">manifest.json이 포함된 STORE 방식 ZIP 패키지를 설치합니다.</p><label class="pick">ZIP 파일 선택<input id="zipPick" type="file" accept=".zip,application/zip"></label></div><p class="muted">파일 선택기는 사용자 탭에서 직접 열리도록 구성되어 있습니다. 브라우저가 파일 접근 자체를 막는 미리보기 환경에서는 Chrome에서 페이지를 여세요.</p></main></section>
<section id="viewer" class="viewer"><div class="bar"><button id="back" class="btn">←</button><span id="title"></span><button id="full" class="btn">전체화면</button><button id="remove" class="btn">삭제</button></div><iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock allow-downloads"></iframe></section>
<script>
const $=s=>document.querySelector(s),E=new TextEncoder(),D=new TextDecoder();let current=null;
const DB='webapp-launcher-v3';function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('apps'))d.createObjectStore('apps',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:['appId','path']});if(!d.objectStoreNames.contains('data'))d.createObjectStore('data',{keyPath:['appId','key']})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function norm(p){let a=[];for(let x of String(p||'').replace(/\\/g,'/').split('/')){if(!x||x==='.')continue;if(x==='..'){if(!a.length)throw Error('잘못된 경로');a.pop()}else a.push(x)}return a.join('/')}
async function apps(){let d=await db();return new Promise((o,n)=>{let r=d.transaction('apps').objectStore('apps').getAll();r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)})}async function files(id){let d=await db();return new Promise((o,n)=>{let r=d.transaction('files').objectStore('files').getAll(IDBKeyRange.bound([id,''],[id,'\uffff']));r.onsuccess=()=>o(r.result);r.onerror=()=>n(r.error)})}
async function install(m,fs){m={id:String(m.id||'').trim(),name:String(m.name||'').trim(),version:String(m.version||'1.0.0'),entry:norm(m.entry||'index.html'),permissions:m.permissions||['storage','fullscreen']};if(!/^[a-z0-9][a-z0-9._-]{1,63}$/i.test(m.id))throw Error('잘못된 앱 ID');if(!m.name)throw Error('앱 이름이 없습니다');if(!fs.some(f=>norm(f.path)===m.entry))throw Error('entry 파일이 없습니다');let d=await db(),t=d.transaction(['apps','files'],'readwrite'),range=IDBKeyRange.bound([m.id,''],[m.id,'\uffff']);t.objectStore('files').delete(range);t.objectStore('apps').put({...m,updatedAt:Date.now()});for(let f of fs)t.objectStore('files').put({appId:m.id,path:norm(f.path),data:f.data});await new Promise((o,n)=>{t.oncomplete=o;t.onerror=()=>n(t.error)});await render()}
async function render(){let a=await apps();$('#empty').style.display=a.length?'none':'block';$('#grid').innerHTML='';for(let x of a){let e=document.createElement('div');e.className='app';e.innerHTML='<div class="icon">◫</div><div class="name"></div><div class="ver"></div>';e.querySelector('.name').textContent=x.name;e.querySelector('.ver').textContent=x.version;e.onclick=()=>run(x);$('#grid').append(e)}}
async function run(a){let fs=await files(a.id),f=fs.find(x=>x.path===a.entry);if(!f)return alert('entry 파일이 없습니다');current=a;$('#title').textContent=a.name;$('#frame').srcdoc=D.decode(f.data);$('#viewer').classList.add('on')}
async function del(){if(!current||!confirm(current.name+'을 삭제할까요?'))return;let d=await db(),t=d.transaction(['apps','files'],'readwrite');t.objectStore('apps').delete(current.id);t.objectStore('files').delete(IDBKeyRange.bound([current.id,''],[current.id,'\uffff']));await new Promise(o=>t.oncomplete=o);$('#viewer').classList.remove('on');current=null;render()}
async function unzipStore(buf){let b=new Uint8Array(buf),v=new DataView(buf),e=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}if(e<0)throw Error('올바른 ZIP이 아닙니다');let n=v.getUint16(e+10,true),p=v.getUint32(e+16,true),out=[];for(let i=0;i<n;i++){if(v.getUint32(p,true)!==0x02014b50)throw Error('ZIP 오류');let method=v.getUint16(p+10,true),size=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),path=norm(D.decode(b.slice(p+46,p+46+nl)));p+=46+nl+el+cl;if(!path||path.endsWith('/'))continue;if(method!==0)throw Error('현재 ZIP 설치는 STORE(무압축) 방식만 지원합니다');let lnl=v.getUint16(lo+26,true),lel=v.getUint16(lo+28,true),start=lo+30+lnl+lel;out.push({path,data:b.slice(start,start+size)})}return out}
$('#add').onclick=()=>$('#install').classList.add('on');$('.close').onclick=()=>$('#install').classList.remove('on');$('#back').onclick=()=>{$('#viewer').classList.remove('on');$('#frame').srcdoc='';current=null};$('#full').onclick=()=>$('#viewer').requestFullscreen?.();$('#remove').onclick=del;
$('#htmlPick').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let name=f.name.replace(/\.html?$/i,''),id='app.'+name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/^-|-$/g,'');await install({id,name,entry:'index.html'},[{path:'index.html',data:new Uint8Array(await f.arrayBuffer())}]);$('#install').classList.remove('on');alert('설치했습니다')}catch(x){alert(x.message)}finally{e.target.value=''}});
$('#zipPick').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let fs=await unzipStore(await f.arrayBuffer()),mf=fs.find(x=>x.path==='manifest.json');if(!mf)throw Error('manifest.json이 없습니다');await install(JSON.parse(D.decode(mf.data)),fs.filter(x=>x.path!=='manifest.json'));$('#install').classList.remove('on');alert('설치했습니다')}catch(x){alert(x.message)}finally{e.target.value=''}});
$('#backup').onclick=()=>alert('백업/복원과 다중 파일 런타임은 다음 수정에서 다시 연결합니다. 우선 Android 파일 선택 문제를 분리해서 수정한 버전입니다.');render();
</script></body></html>
